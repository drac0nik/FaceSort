# Builds the Windows installer and publishes it as a GitHub release, which FaceSort's
# "Update available" button picks up.
#
# To release a version: set APP_VERSION in ui_common.py (e.g. "1.38.0"), add its README
# section, commit, then push a tag with the same number:
#     git tag v1.38.0 && git push origin v1.38.0
# (or run this workflow by hand from the Actions tab: it reads the version from ui_common.py).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path ui_common.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and "v$v" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME doesn't match APP_VERSION $v in ui_common.py"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest pyflakes

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build FaceSort
        run: >
          python -m PyInstaller --noconfirm --clean --log-level WARN --onedir --windowed
          --name FaceSort --icon icon.ico
          --add-data "models;models" --add-data "icon.png;."
          --collect-all pillow_heif --collect-binaries onnxruntime --collect-binaries cv2
          --collect-binaries rawpy --collect-data imageio_ffmpeg --exclude-module tkinter
          --distpath dist --workpath build facesort.py

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc /Q "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=..\dist\FaceSort" installer\FaceSort.iss
          $exe = "dist\FaceSort-Setup-${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $exe)) { throw "installer not built" }
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$h  FaceSort-Setup-${{ steps.ver.outputs.version }}.exe" | Out-File -Encoding ascii "$exe.sha256"

      - name: Release notes from the README
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $mm = ($v -split '\.')[0..1] -join '.'
          $lines = Get-Content README.txt
          $out = @(); $on = $false
          foreach ($l in $lines) {
            if ($l -match "\(($([regex]::Escape($v))|$([regex]::Escape($mm)))\)\s*$") { $on = $true; $out += $l; continue }
            if ($on -and $l -match '^\S.*\(\d+\.\d+(\.\d+)?\)\s*$') { break }
            if ($on) { $out += $l }
          }
          if (-not $out) { $out = @("FaceSort $v") }
          $out | Out-File -Encoding utf8 notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release create "v$v" "dist\FaceSort-Setup-$v.exe" "dist\FaceSort-Setup-$v.exe.sha256" `
            --title "FaceSort $v" --notes-file notes.md --target $env:GITHUB_SHA
